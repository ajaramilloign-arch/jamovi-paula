<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jamovi + Estadística Inferencial - Paula</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #5b7bf5;
            --secondary: #8b5cf6;
            --accent: #6d28d9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-muted: #cbd5e1;
            --border: #475569;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(91, 123, 245, 0.3);
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: white;
        }
        .badges {
            display: flex;
            gap: 10px;
        }
        .badge {
            background: rgba(255,255,255,0.25);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }
        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 100px);
        }
        .sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
        }
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 8px 0;
        }
        .module {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        .module:hover {
            border-color: var(--primary);
            transform: translateX(3px);
        }
        .module.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }
        .content {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            animation: fadeIn 0.3s ease;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .content h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .content h2 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 12px;
            color: var(--primary);
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 8px;
        }
        .explanation {
            background: rgba(91, 123, 245, 0.1);
            border-left: 3px solid var(--primary);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(91, 123, 245, 0.1);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(91, 123, 245, 0.2);
        }
        .card-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .card-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 14px;
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .exercise {
            background: rgba(91, 123, 245, 0.1);
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .exercise-title {
            color: var(--secondary);
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option {
            background: var(--surface);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-size: 12px;
        }
        .option:hover {
            background: var(--primary);
            color: white;
        }
        .option.correct {
            background: var(--success);
            color: white;
        }
        .option.incorrect {
            background: var(--danger);
            color: white;
        }
        .feedback {
            margin-top: 8px;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }
        .feedback.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(91, 123, 245, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .progress-bar {
            background: var(--border);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            height: 100%;
            transition: width 0.3s ease;
        }
        .exam-section {
            background: rgba(245, 158, 11, 0.1);
            border: 2px solid var(--warning);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .exam-title {
            color: var(--warning);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .exam-question {
            background: var(--surface);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--warning);
        }
        .exam-question strong {
            color: var(--warning);
        }
        .result-box {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--success);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        .result-score {
            font-size: 48px;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 10px;
        }
        .result-text {
            font-size: 16px;
            color: var(--text);
            margin-bottom: 15px;
        }
        .table-content {
            overflow-x: auto;
            margin-bottom: 15px;
        }
        .table-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .table-content th, .table-content td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }
        .table-content th {
            background: rgba(91, 123, 245, 0.2);
            color: var(--primary);
            font-weight: 700;
        }
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative;
                top: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">📊 jamovi para Paula - Estadística Inferencial</div>
            <div class="badges">
                <div class="badge">👋 Paula, ¡estás estudiando!</div>
                <div class="badge">⏱️ <span id="tiempo">0s</span></div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content" id="contenido"></main>
    </div>

    <script>
        // CONFIGURACIÓN
        let paulaId = localStorage.getItem('paula_id');
        if (!paulaId) {
            paulaId = 'paula_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('paula_id', paulaId);
        }

        let tiempoInicio = Date.now();
        let moduloActual = 0;
        let preguntasRespondidas = 0;
        let aciertos = 0;
        let calificacionFinal = 0;

        // MÓDULOS COMPLETOS
        const modulos = [
            {
                numero: 1,
                titulo: "¡Bienvenida Paula!",
                nivel: "Cero",
                subtitulo: "Tu herramienta personalizada para dominar jamovi y estadística inferencial",
                contenido: `
                    <div class="explanation">
                        <strong>¡Hola Paula! 👋</strong><br><br>
                        Esta herramienta fue creada <strong>especialmente para ti</strong> para que aprendas jamovi y estadística de forma interactiva y progresiva.
                    </div>
                    <h2>¿Cómo funciona?</h2>
                    <div class="cards-grid">
                        <div class="card">
                            <div class="card-icon">📚</div>
                            <div class="card-title">8 Módulos Progresivos</div>
                            <div class="card-desc">De CERO a EXPERTO. Cada módulo construye sobre el anterior.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">✏️</div>
                            <div class="card-title">Ejercicios Interactivos</div>
                            <div class="card-desc">Practica después de cada tema con retroalimentación inmediata.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">🎓</div>
                            <div class="card-title">Evaluación Final</div>
                            <div class="card-desc">20 preguntas que miden tu dominio. Calificación 0-5.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">📊</div>
                            <div class="card-title">Tu Progreso</div>
                            <div class="card-desc">Tracking automático de tiempo, respuestas y desempeño.</div>
                        </div>
                    </div>
                    <h2>Temas que aprenderás:</h2>
                    <div class="explanation">
                        1. <strong>Escalas de Medida:</strong> Nominal, Ordinal, Intervalo, Razón<br>
                        2. <strong>Tendencia Central:</strong> Media, Mediana, Moda<br>
                        3. <strong>Dispersión:</strong> Varianza, Desviación Estándar, Rango, CV<br>
                        4. <strong>Forma:</strong> Asimetría, Curtosis<br>
                        5. <strong>Análisis de Datos:</strong> Interpretación, outliers<br>
                        6. <strong>Prueba t:</strong> Una muestra, independientes, pareadas<br>
                        7. <strong>No-Paramétricas:</strong> Mann-Whitney, Wilcoxon, Kruskal-Wallis
                    </div>
                    <h2>⏰ Consejos para Paula:</h2>
                    <div class="explanation">
                        ✓ Dedica <strong>15-20 minutos por módulo</strong><br>
                        ✓ Responde los <strong>ejercicios después de leer</strong><br>
                        ✓ Si no entiendes algo, <strong>relée la sección</strong><br>
                        ✓ Cuando termines todos los módulos, <strong>haz la evaluación final</strong><br>
                        ✓ Tu desempeño será <strong>guardado automáticamente</strong>
                    </div>
                `,
                ejercicios: []
            },

            // TEMA 1: ESCALAS DE MEDIDA
            {
                numero: 2,
                titulo: "Escalas de Medida",
                nivel: "Principiante",
                subtitulo: "Nominal, Ordinal, Intervalo, Razón - Identificación del tipo de variable",
                contenido: `
                    <h2>¿Por qué importan las escalas?</h2>
                    <div class="explanation">
                        La escala de medida determina <strong>QUÉ ANÁLISIS PUEDES HACER</strong> en jamovi. Es FUNDAMENTAL identificar correctamente el tipo de variable.
                    </div>
                    <h2>Las 4 Escalas de Medida</h2>
                    <div class="cards-grid">
                        <div class="card">
                            <div class="card-icon">🏷️</div>
                            <div class="card-title">NOMINAL</div>
                            <div class="card-desc"><strong>Sin orden.</strong> Categorías como: Género (M/F), Carrera, Religión, Diagnóstico, Estatus civil.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">📊</div>
                            <div class="card-title">ORDINAL</div>
                            <div class="card-desc"><strong>Con orden.</strong> Likert (1-5), Satisfacción (Bajo/Medio/Alto), Nivel (Básico/Inter/Avanzado).</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">📏</div>
                            <div class="card-title">INTERVALO</div>
                            <div class="card-desc"><strong>Equidistantes, sin cero absoluto.</strong> Temperatura, CI (100-150), Calificación (0-100).</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">🎯</div>
                            <div class="card-title">RAZÓN</div>
                            <div class="card-desc"><strong>Intervalo + cero absoluto.</strong> Edad (años), Peso (kg), Ingresos (\$), Número de personas.</div>
                        </div>
                    </div>
                    <h2>¿Cómo identificar según contexto?</h2>
                    <div class="explanation">
                        Debes considerar el contexto y el tipo de datos para clasificarlos correctamente. En jamovi, esta clasificación determina qué test estadístico puedes aplicar.
                    </div>
                `,
                ejercicios: [
                    {
                        pregunta: "Género (M/F) es escala:",
                        opciones: [
                            { texto: "Nominal", correcto: true },
                            { texto: "Ordinal", correcto: false },
                            { texto: "Intervalo", correcto: false }
                        ]
                    },
                    {
                        pregunta: "Una escala Likert (Muy desacuerdo - Muy de acuerdo) es:",
                        opciones: [
                            { texto: "Nominal", correcto: false },
                            { texto: "Ordinal", correcto: true },
                            { texto: "Razón", correcto: false }
                        ]
                    },
                    {
                        pregunta: "La edad (en años) es escala:",
                        opciones: [
                            { texto: "Intervalo", correcto: false },
                            { texto: "Ordinal", correcto: false },
                            { texto: "Razón", correcto: true }
                        ]
                    }
                ]
            },

            // TEMA 2: MEDIDAS DE TENDENCIA CENTRAL
            {
                numero: 3,
                titulo: "Medidas de Tendencia Central",
                nivel: "Principiante",
                subtitulo: "Media, Mediana, Moda - Interpretación en contextos reales",
                contenido: `
                    <h2>¿Qué es una medida de tendencia central?</h2>
                    <div class="explanation">
                        Son números que <strong>representan el "centro" de tus datos</strong>. Te dicen cuál es el valor típico o promedio.
                    </div>
                    <h2>Las 3 Medidas</h2>
                    <div class="cards-grid">
                        <div class="card">
                            <div class="card-icon">➕</div>
                            <div class="card-title">MEDIA</div>
                            <div class="card-desc"><strong>Suma de todos ÷ cantidad.</strong> Sensible a outliers. Úsala cuando no hay valores extremos.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">📍</div>
                            <div class="card-title">MEDIANA</div>
                            <div class="card-desc"><strong>Valor del medio.</strong> Robusta con outliers. Mejor para datos sesgados.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">🔄</div>
                            <div class="card-title">MODA</div>
                            <div class="card-desc"><strong>Valor que más se repite.</strong> Útil para categorías y datos discretos.</div>
                        </div>
                    </div>
                    <h2>¿Cuál usar según contexto?</h2>
                    <div class="explanation">
                        • <strong>Datos normales sin outliers:</strong> Usa MEDIA<br>
                        • <strong>Datos con outliers o sesgados:</strong> Usa MEDIANA<br>
                        • <strong>Datos categóricos:</strong> Usa MODA
                    </div>
                `,
                ejercicios: [
                    {
                        pregunta: "Con datos que tienen outliers extremos, ¿cuál es mejor?",
                        opciones: [
                            { texto: "Media", correcto: false },
                            { texto: "Mediana", correcto: true },
                            { texto: "Moda", correcto: false }
                        ]
                    },
                    {
                        pregunta: "¿Qué es la media?",
                        opciones: [
                            { texto: "Suma de todos ÷ cantidad", correcto: true },
                            { texto: "El valor del medio", correcto: false },
                            { texto: "El valor que más se repite", correcto: false }
                        ]
                    }
                ]
            },

            // TEMA 3: MEDIDAS DE DISPERSIÓN
            {
                numero: 4,
                titulo: "Medidas de Dispersión",
                nivel: "Intermedio",
                subtitulo: "Varianza, Desviación estándar, Rango, Coeficiente de variación - Interpretación de variabilidad",
                contenido: `
                    <h2>¿Qué es la dispersión?</h2>
                    <div class="explanation">
                        Mide <strong>CUÁNTO SE DISPERSAN TUS DATOS</strong> alrededor de la media. ¿Están todos juntos o muy esparcidos?
                    </div>
                    <h2>Las 4 Medidas de Dispersión</h2>
                    <div class="cards-grid">
                        <div class="card">
                            <div class="card-icon">📏</div>
                            <div class="card-title">RANGO</div>
                            <div class="card-desc"><strong>Máximo - Mínimo.</strong> Simple pero muy sensible a outliers.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">📊</div>
                            <div class="card-title">VARIANZA (S²)</div>
                            <div class="card-desc"><strong>Promedio de desviaciones al cuadrado.</strong> Difícil de interpretar porque usa unidades al cuadrado.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">⭐</div>
                            <div class="card-title">DESVIACIÓN ESTÁNDAR (S)</div>
                            <div class="card-desc"><strong>LA MÁS IMPORTANTE. √Varianza.</strong> Mismo eje que los datos. Fácil de interpretar.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">🔄</div>
                            <div class="card-title">COEF. VARIACIÓN (CV)</div>
                            <div class="card-desc"><strong>Compara variables diferentes.</strong> CV = (S ÷ Media) × 100%</div>
                        </div>
                    </div>
                    <h2>¿Cuál usar en jamovi?</h2>
                    <div class="explanation">
                        • <strong>Para reportar:</strong> Usa DESVIACIÓN ESTÁNDAR<br>
                        • <strong>Para comparar dos variables:</strong> Usa COEFICIENTE DE VARIACIÓN<br>
                        • <strong>En tablas académicas:</strong> Reporta Media ± Desviación Estándar
                    </div>
                `,
                ejercicios: [
                    {
                        pregunta: "¿Cuál es la medida de dispersión MÁS USADA?",
                        opciones: [
                            { texto: "Rango", correcto: false },
                            { texto: "Varianza", correcto: false },
                            { texto: "Desviación Estándar", correcto: true }
                        ]
                    },
                    {
                        pregunta: "¿Para qué sirve el Coeficiente de Variación?",
                        opciones: [
                            { texto: "Para encontrar el máximo", correcto: false },
                            { texto: "Para comparar dos variables diferentes", correcto: true },
                            { texto: "Para contar datos", correcto: false }
                        ]
                    }
                ]
            },

            // TEMA 4: MEDIDAS DE FORMA
            {
                numero: 5,
                titulo: "Medidas de Forma",
                nivel: "Intermedio",
                subtitulo: "Asimetría (positiva, negativa, simétrica) - Curtosis (leptocúrtica, mesocúrtica, platicúrtica) - Interpretación de la forma de la distribución",
                contenido: `
                    <h2>¿Qué es la forma de una distribución?</h2>
                    <div class="explanation">
                        Describe <strong>VISUALMENTE CÓMO SE VEN TUS DATOS</strong>. ¿Son simétricos? ¿Tienen cola? ¿Son puntiagudos?
                    </div>
                    <h2>ASIMETRÍA (Skewness)</h2>
                    <div class="cards-grid">
                        <div class="card">
                            <div class="card-icon">⚖️</div>
                            <div class="card-title">SIMÉTRICA</div>
                            <div class="card-desc">Asimetría = 0. La distribución tiene forma de campana normal.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">↗️</div>
                            <div class="card-title">ASIMETRÍA POSITIVA</div>
                            <div class="card-desc">Asimetría > 0. Cola larga a la derecha. Mayoría de datos a la izquierda.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">↖️</div>
                            <div class="card-title">ASIMETRÍA NEGATIVA</div>
                            <div class="card-desc">Asimetría < 0. Cola larga a la izquierda. Mayoría de datos a la derecha.</div>
                        </div>
                    </div>
                    <h2>CURTOSIS (Kurtosis)</h2>
                    <div class="cards-grid">
                        <div class="card">
                            <div class="card-icon">📈</div>
                            <div class="card-title">LEPTOCÚRTICA</div>
                            <div class="card-desc">Curtosis > 0. Muy puntiaguda. Colas pesadas. Mayor probabilidad de outliers.</div>
                        </div>
                        <div class="card">
                            <div class="card-icon">📊</div>
                            <div class="card-title">MESOCÚRTICA</div>
                            <div class="card-desc">Curtosis = 0. Normal. Distribución de campana típica (gaussiana).</div>
                        </div>

                </div>
            `;

            document.getElementById('contenido').innerHTML = html;

            guardarDatos({
                tipo: 'examen',
                aciertos: aciertosExamen,
                total: preguntasExamen.length,
                calificacion: calificacionFinal
            });
        }

        function guardarDatos(datos) {
            let historial = JSON.parse(localStorage.getItem('paula_historial') || '[]');
            historial.push({...datos, timestamp: new Date().toISOString(), paulaId});
            localStorage.setItem('paula_historial', JSON.stringify(historial));
        }

        // INICIALIZAR
        renderSidebar();
        mostrarModulo(0);
    </script>
</body>
</html>
